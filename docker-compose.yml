services:
  mysql:
    image: mysql:8.0
    container_name: sis-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: sis
      TZ: UTC
    ports:
      - "${DB_PORT}:3306"              # máy bạn kết nối qua 3307
    command: ["--default-authentication-plugin=mysql_native_password"]
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:5
    container_name: sis-phpmyadmin
    environment:
      PMA_HOST: mysql            # trỏ tới service 'mysql'
      PMA_PORT: 3306
    ports:
      - "8090:80"                # mở ở http://localhost:8090
    depends_on:
      - mysql

volumes:
  mysql_data:
    name: ${VOLUME_NAME}
    external: true
