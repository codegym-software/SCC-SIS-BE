services:
  mysql:
    image: mysql:8.0
    container_name: sis-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: "Asia/Ho_Chi_Minh"          # 🕓 Cấu hình timezone cho MySQL
    ports:
      - "${DB_PORT}:3306"
    command: ["--default-authentication-plugin=mysql_native_password"]
    volumes:
      - mysql_data:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro  # Đồng bộ thời gian hệ thống container

  phpmyadmin:
    image: phpmyadmin:5
    container_name: sis-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      TZ: "Asia/Ho_Chi_Minh"          # 🕓 Cấu hình timezone cho phpMyAdmin
    ports:
      - "${PHPMYADMIN_PORT}:80"
    depends_on:
      - mysql
    volumes:
      - /etc/localtime:/etc/localtime:ro  # Đồng bộ thời gian hệ thống container

volumes:
  mysql_data:
    name: ${VOLUME_NAME}
    external: true
